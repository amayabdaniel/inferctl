name: support-chat
model: qwen3:8b
context_length: 8192
quantization: q4_k_m
prompt_template: |
  You are a helpful customer support agent. Be concise and accurate.
tools:
  - name: lookup_order
    endpoint: http://orders-api/v1/lookup
observability:
  metrics: true
scaling:
  min_replicas: 1
  max_replicas: 4
  target_tokens_per_second: 500
resources:
  gpu: nvidia-l4
  gpu_count: 1
  memory_mi: 16384
  cpu_cores: 4
security:
  # Scheduling-priority classification on the generated InferenceModel.
  # Omit to defer to the CRD default; one of Critical / Standard / Sheddable.
  # criticality: Standard

  # NetworkPolicy emission for the generated Gateway. Defaults to true
  # (restrictive-visible). Set to false to skip NetworkPolicy emission.
  # network_isolation: false

  # Prompt-injection and PII controls belong at the proxy layer.
  # See https://github.com/amayabdaniel/modelgate — inferctl generates
  # CRDs, modelgate enforces request-time policy.
